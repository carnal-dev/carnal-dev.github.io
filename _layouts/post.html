---
layout: default
---
<article class="post">
  <header class="post-head">
    <p class="kicker">{{ page.date | date: "%Y·%m·%d" }}{% if page.tags and page.tags.size > 0 %} · {{ page.tags | join: " · " }}{% endif %}</p>
    <h1 class="post-title">{{ page.title }}</h1>
    {% if page.subtitle %}<p class="post-subtitle">{{ page.subtitle }}</p>{% endif %}
    <div class="rule ember"></div>
  </header>

  {% if page.plate %}
  <section class="engraving">
    <figure>
      <div class="plate">
        <img src="{{ page.plate | relative_url }}" alt="{{ page.plate_title }}" loading="lazy">
      </div>
      <figcaption class="placard">
        <span class="placard-title">{{ page.plate_title }}</span>
        <span class="placard-meta">{{ page.plate_meta }}</span>
        {% if page.plate_note %}<span class="placard-note">{{ page.plate_note }}</span>{% endif %}
      </figcaption>
    </figure>
  </section>
  {% endif %}

  <div class="prose">
    {{ content }}
  </div>

  <footer class="post-foot">
    <div class="rule"></div>
    <p class="dim mono">fin · <a href="{{ '/' | relative_url }}">index</a></p>
  </footer>
</article>
