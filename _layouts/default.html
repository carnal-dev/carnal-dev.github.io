<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="icon" type="image/jpeg" href="{{ '/assets/img/mark.jpg' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/img/mark.jpg' | relative_url }}">
</head>
<body>
  <header class="masthead">
    <a class="wordmark" href="{{ '/' | relative_url }}"><img class="mark" src="{{ '/assets/img/mark.jpg' | relative_url }}" alt="">carnal</a>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="colophon">
    <div class="rule"></div>
    <div class="colophon-row">
      <span class="col-label">elsewhere</span>
      <a href="{{ site.links.github }}">github</a>
      <a href="{{ site.links.huggingface }}">hugging face</a>
      <a href="{{ site.links.kaggle }}">kaggle</a>
      <a href="{{ site.links.x }}">x</a>
      <a href="mailto:{{ site.email }}">{{ site.email }}</a>
    </div>
  </footer>
</body>
</html>
