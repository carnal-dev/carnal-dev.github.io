---
layout: default
---
<section class="engraving">
  <figure>
    <div class="plate">
      <img src="{{ '/assets/img/melencolia.jpg' | relative_url }}" alt="Melencolia I, an engraving by Albrecht Durer, 1514">
    </div>
    <figcaption class="placard">
      <span class="placard-title">Melencolia I</span>
      <span class="placard-meta">Albrecht D&uuml;rer · engraving · 1514 · public domain</span>
    </figcaption>
  </figure>
</section>

<section class="index">
  <h2 class="section-label">Writing</h2>
  <div class="rule"></div>
  <ul class="post-list">
    {% for post in site.posts %}
    <li>
      <a class="post-row" href="{{ post.url | relative_url }}">
        <span class="post-date mono">{{ post.date | date: "%Y·%m·%d" }}</span>
        <span class="post-name">{{ post.title }}</span>
      </a>
    </li>
    {% endfor %}
  </ul>
</section>
